name: coin-guard-prod
services:
  postgres:
    container_name: coin-guard-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: coin-guard-web
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
